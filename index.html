<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetVillage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .spin { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">

    <div id="splash" class="fixed inset-0 bg-gray-900 flex flex-col items-center justify-center z-50">
        <h1 class="blink text-blue-500 text-5xl font-black mb-8">NETVILLAGE</h1>
        <div class="spin text-6xl">🌐</div>
    </div>

    <div id="modalSave" class="hidden fixed inset-0 bg-black/80 z-[70] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl text-center border-2 border-green-500 shadow-2xl">
            <div class="text-6xl mb-4">✅</div>
            <h3 class="font-bold text-xl">Enregistré dans Supabase !</h3>
        </div>
    </div>

    <div id="modalPdfConfirm" class="hidden fixed inset-0 bg-black/80 z-[80] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl text-center border-2 border-blue-500 shadow-2xl">
            <div class="text-6xl mb-4">📄</div>
            <h3 class="font-bold text-xl">PDF Téléchargé !</h3>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-white dark:bg-gray-800 shadow-md">
        <h1 class="font-bold text-lg">NetVillage</h1>
        <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700">🌙/☀️</button>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <div id="dashboard" class="space-y-4">
            <button onclick="showSection('formSection')" class="w-full py-8 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">➕ Nouvelle Inscription</button>
            <button onclick="showSection('listSection'); renderTable();" class="w-full py-8 bg-green-600 text-white rounded-2xl font-bold shadow-lg">📋 Mes Abonnés</button>
        </div>

        <div id="formSection" class="hidden bg-white dark:bg-gray-800 p-6 rounded-2xl shadow">
            <h2 class="font-bold mb-4">Nouvelle Inscription</h2>
            <select id="moisInscription" class="w-full p-4 mb-3 rounded-xl bg-gray-100 dark:bg-gray-700 border"></select>
            <input type="text" id="nomComplet" placeholder="Nom et Prénom" class="w-full p-4 mb-3 rounded-xl bg-gray-100 dark:bg-gray-700 border">
            <input type="number" id="montant" value="500" class="w-full p-4 mb-4 rounded-xl bg-gray-100 dark:bg-gray-700 border">
            <button onclick="ajouterClient()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">Enregistrer</button>
            <button onclick="showSection('dashboard')" class="w-full mt-4 text-gray-400">Retour</button>
        </div>

        <div id="listSection" class="hidden bg-white dark:bg-gray-800 p-4 rounded-2xl shadow">
            <h2 class="font-bold mb-2">Liste des Abonnés</h2>
            <select id="filtreMois" onchange="renderTable()" class="w-full p-3 mb-4 bg-gray-200 dark:bg-gray-700 rounded-xl"></select>
            <div id="listeTableau" class="overflow-x-auto text-xs"></div>
            <button onclick="ouvrirModalPDF()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold mt-4">📄 Exporter PDF</button>
            <button onclick="showSection('dashboard')" class="w-full mt-2 py-2 text-gray-500">Retour</button>
        </div>
    </main>

    <script>
        // Configuration Supabase
        const supabaseUrl = 'https://eedexpemakvmrqhzjwxj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZGV4cGVtYWt2bXJxaHpqd3hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTQyNjcsImV4cCI6MjA5NTgzMDI2N30.IpDVhHZRPlxFY8kHCYLVAtwwDXQxsPPYSp5gqaTgDCQ';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const nomsMois = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
        
        // Initialisation sélecteurs
        const selects = document.querySelectorAll('#moisInscription, #filtreMois');
        selects.forEach(sel => {
            nomsMois.forEach((m, i) => sel.innerHTML += `<option value="${i}" ${i == new Date().getMonth() ? 'selected' : ''}>${m}</option>`);
        });

        function showSection(id) {
            ['dashboard', 'formSection', 'listSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function ajouterClient() {
            const nom = document.getElementById('nomComplet').value;
            const mois = document.getElementById('moisInscription').value;
            const montant = document.getElementById('montant').value;
            
            const { error } = await supabase.from('abonnes').insert([{ nom, montant, mois: parseInt(mois) }]);
            
            if (error) return alert("Erreur : " + error.message);
            
            document.getElementById('modalSave').classList.remove('hidden');
            setTimeout(() => { document.getElementById('modalSave').classList.add('hidden'); showSection('dashboard'); }, 2000);
        }

        async function renderTable() {
            const filtre = document.getElementById('filtreMois').value;
            const { data: clients } = await supabase.from('abonnes').select('*').eq('mois', filtre);
            
            let html = `<table class="w-full text-left"><thead><tr><th>Nom</th><th>Mois</th><th>Statut</th></tr></thead><tbody>`;
            clients.forEach(c => {
                html += `<tr class="border-b"><td>${c.nom}</td><td>${nomsMois[c.mois]}</td><td class="text-green-500">Valide</td></tr>`;
            });
            document.getElementById('listeTableau').innerHTML = html + `</tbody></table>`;
        }

        function ouvrirModalPDF() {
            // ... (Gardez votre code PDF précédent ici)
            document.getElementById('modalPdfConfirm').classList.remove('hidden');
            setTimeout(() => document.getElementById('modalPdfConfirm').classList.add('hidden'), 2000);
        }

        window.addEventListener('load', () => setTimeout(() => document.getElementById('splash').style.display = 'none', 2500));
    </script>
</body>
</html>
